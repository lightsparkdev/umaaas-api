type: object
required:
  - message
  - status
  - code
properties:
  status:
    enum:
      - 502
    type: integer
    description: HTTP status code
  code:
    type: string
    description: |
      | Error Code | Description |
      |------------|-------------|
      | INVALID_PAYREQ_RESPONSE | Counterparty payment request response was invalid. Retryable |
      | COUNTERPARTY_SERVER_ERROR | Counterparty returned a server error. Retryable |
    enum:
      - INVALID_PAYREQ_RESPONSE
      - COUNTERPARTY_SERVER_ERROR
  message:
    type: string
    description: Error message
  details:
    type: object
    description: Additional error details
